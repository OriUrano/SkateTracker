name: Deploy Skate

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: skate-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: skate-oriurano
  CLOUDFRONT_DISTRIBUTION_ID: E2H1EGOBVKAH11

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          find . -maxdepth 1 -type f -name '*.png' | grep -q .

      - name: Prepare deploy artifact
        run: |
          rm -rf dist
          mkdir dist
          cp index.html manifest.json sw.js dist/
          cp ./*.png dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
